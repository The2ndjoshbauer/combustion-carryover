// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '2.2.10'
        android_gradle_version = '9.1.1'
        appcompat_version = '1.6.1'
        material_version = '1.8.0'
        lifecycle_runtime_ktx_version = '2.6.2'
        navigation_compose_version = '2.7.5'
        navigation_common_ktx_version = '2.7.5'
        activity_compose_version = '1.8.1'
        kable_core_version = '0.21.0'
        easypermissions_ktx_version = '1.0.0'
        settings_compose_version = '0.13.0'
        lifecycle_service_version = '2.6.2'
        play_services_base_version = '18.0.1'
        play_services_auth_version = '20.1.0'
        junit_version = '1.1.5'
        espresso_core_version = '3.5.1'
        mpandroidchart_version = 'v3.1.0'
        viewbinding_version = '1.5.4'
        combustion_framework_version = 'v1.0.0'
    }
    repositories {
        google()
        maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$android_gradle_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}